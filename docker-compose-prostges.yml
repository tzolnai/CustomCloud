services:
  database:
    image: postgres:18-alpine
    container_name: postgres_database
    restart: always
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - database_data:/var/lib/postgresql

  custom_cloud:
    build:
      context: .
      args:
        NEXTCLOUD_VERSION: ${NEXTCLOUD_VERSION}
    image: custom_cloud:${NEXTCLOUD_VERSION}-${IMAGE_VERSION}
    container_name: custom_cloud
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - database
    environment:
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: changeme123
      NEXTCLOUD_TRUSTED_DOMAINS: localhost
      POSTGRES_HOST: postgres_database
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - custom_cloud_data:/var/www/html

volumes:
  database_data:
  custom_cloud_data:
